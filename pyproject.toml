[project]
name = "home-services"
version = "0.4.10"
description = "Optional private Linux/Pi backend: storage guards, managed transfers, durable jobs, backup recovery, camera gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
home-services = "home_services.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
